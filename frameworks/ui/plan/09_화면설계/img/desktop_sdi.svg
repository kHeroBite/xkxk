<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13">
  <!-- 데스크톱 독립 창(SDI)·분할 와이어프레임 (03_데스크톱_화면설계.md §3) -->
  <rect x="0" y="0" width="1280" height="800" fill="#2B3A55"/>
  <text x="20" y="28" fill="#C9D3EA" font-size="15">OS 바탕화면 — 메인 창(왼쪽)과 앱 밖 독립 창(오른쪽, 다른 모니터로 이동 가능)</text>
  <rect x="20" y="48" width="700" height="720" rx="8" fill="#F3F4F7"/>
  <rect x="20" y="48" width="700" height="32" rx="8" fill="#22325A"/>
  <rect x="30" y="55" width="18" height="18" rx="4" fill="#7FA7FF"/>
  <text x="62" y="69" fill="#FFFFFF">파일  창  보기  시스템</text><text x="630" y="69" fill="#FFFFFF">—  ☐  ✕</text>
  <rect x="20" y="80" width="700" height="26" fill="#E4E8F0"/><text x="30" y="98">[홈 대시보드] [이슈 목록 ✓]</text>
  <rect x="20" y="106" width="150" height="662" fill="#FFFFFF" stroke="#C5CBD8"/><text x="30" y="126">탐색기</text>
  <rect x="170" y="106" width="550" height="330" fill="#FFFFFF" stroke="#8C9BBE"/>
  <rect x="170" y="106" width="550" height="24" fill="#22325A"/><text x="180" y="123" fill="#FFFFFF">주 영역 — 이슈 목록</text>
  <rect x="170" y="436" width="550" height="6" fill="#B8C2D6"/><text x="560" y="433" fill="#555" font-size="11">분할선(끌어서 크기)</text>
