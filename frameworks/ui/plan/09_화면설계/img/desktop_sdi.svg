  <rect x="760" y="562" width="500" height="26" fill="#E4E8F0"/><text x="772" y="580">[캘린더 ✓] [메신저 대화방]  ← 2개 이상이면 탭 줄 표시</text>
  <text x="772" y="620" fill="#555">로고 클릭 = 창 메뉴 · 로고 더블클릭 = 닫기 · 창 ▸ 독립 창 ▸ MDI로 재결합</text>
  <text x="772" y="644" fill="#555">창 ▸ 모니터 ▸ 모니터 2 선택 후 최대화 = 그 모니터 작업 영역 전체</text>
