  <rect x="380" y="560" width="300" height="96" rx="6" fill="#FFFFFF" stroke="#22325A"/>
  <text x="392" y="582">우클릭 메뉴</text><text x="392" y="604" fill="#555">닫기 · 다른 탭 모두 닫기</text>
  <text x="392" y="624" fill="#555">독립 창으로 분리</text><text x="392" y="644" fill="#22325A" font-weight="bold">분할 해제 (주 영역 MDI 로 합침)</text>
  <rect x="760" y="120" width="500" height="380" rx="8" fill="#FFFFFF" stroke="#22325A"/>
  <rect x="760" y="120" width="500" height="32" rx="8" fill="#22325A"/>
  <rect x="770" y="127" width="18" height="18" rx="4" fill="#7FA7FF"/>
