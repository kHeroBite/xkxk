  <text x="772" y="176" fill="#8A93A6" font-size="11">문서 1개 → 탭 줄 숨김 (U15)</text>
  <rect x="772" y="186" width="476" height="300" fill="#F3F4F7"/><text x="790" y="210">WBS 트리 │ 간트 캔버스</text>
