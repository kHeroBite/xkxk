  <rect x="560" y="420" width="440" height="32" rx="8" fill="#DCE3F2"/>
  <text x="572" y="441">관리형 창 — 이슈 상세 (분리 대신)</text>
  <text x="572" y="490" fill="#555">파일 첨부: 올리기 · 내려받기 (W-06)</text>
  <text x="572" y="514" fill="#555">Ctrl+Tab·Ctrl+W 는 브라우저 예약 → 창 메뉴·탭으로 (W-04)</text>
  <text x="230" y="780" fill="#555">앱 화면 폭 &lt; 600dp → 스마트폰 NAV 자동 전환 · 높이 변화로는 바꾸지 않음</text>
</svg>
